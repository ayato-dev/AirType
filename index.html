<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airtype</title>
    <link rel="stylesheet" href="/src/styles/settings.css" />
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path d="M10.73 5.08a10.74 10.74 0 0 1 11.2 6.57 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49" />
        <path d="M14.08 14.16a3 3 0 0 1-4.24-4.24" />
        <path d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.45-5.14M2 2l20 20" />
      </symbol>
    </svg>

    <div class="window">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" rx="5.4" fill="#17181a" />
            <rect x="3.96" y="8" width="11.5" height="8" rx="1.5" fill="#e3f56a" />
            <rect x="5.83" y="10.25" width="7.78" height="1.28" rx="0.64" fill="#17181a" />
            <rect x="5.83" y="12.53" width="5.24" height="1.28" rx="0.64" fill="#17181a" fill-opacity="0.55" />
            <path d="M16.3 5.8h3.2M17.9 5.8v12.4M16.3 18.2h3.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none" />
          </svg>
          <span class="brand-name" data-tauri-drag-region>Airtype</span>
        </div>
        <div class="win-buttons">
          <button class="win-button" id="minimize" type="button" aria-label="Свернуть окно">
            <svg class="icon"><use href="#i-minus" /></svg>
          </button>
          <button class="win-button" id="close" type="button" aria-label="Закрыть окно">
            <svg class="icon"><use href="#i-x" /></svg>
          </button>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="Разделы" data-tauri-drag-region>
        <button class="tab" type="button" role="tab" id="tab-actions" data-view="actions" aria-controls="view-actions">Действия</button>
        <button class="tab" type="button" role="tab" id="tab-model" data-view="model" aria-controls="view-model">Модель</button>
        <button class="tab" type="button" role="tab" id="tab-general" data-view="general" aria-controls="view-general">Общее</button>
      </nav>

      <main class="views">
        <div class="notes" id="notes" aria-live="polite"></div>

        <section class="view" id="view-actions" role="tabpanel" aria-labelledby="tab-actions">
          <figure class="sheet preview" aria-label="Пример">
            <p class="preview-before"><mark id="preview-before"></mark></p>
            <div class="preview-keys" id="preview-keys"></div>
            <p class="preview-after" id="preview-after"></p>
          </figure>

          <h2 class="title">Сочетания</h2>
          <ul class="actions" id="actions"></ul>
          <button class="add" id="add-action" type="button">
            <svg class="icon"><use href="#i-plus" /></svg>Добавить своё действие
          </button>

          <h2 class="title">Панель под полем</h2>
          <ul class="actions" id="panel-row"></ul>

          <h2 class="title">Перевод</h2>
          <div class="pair">
            <label class="field">
              <span class="field-label">Переводить на</span>
              <input class="input" id="target-lang" spellcheck="false" />
            </label>
            <label class="field">
              <span class="field-label">Если текст уже на нём, то на</span>
              <input class="input" id="secondary-lang" spellcheck="false" />
            </label>
          </div>
        </section>

        <section class="view" id="view-model" role="tabpanel" aria-labelledby="tab-model" hidden>
          <fieldset class="pick">
            <legend class="visually-hidden">Кто отвечает</legend>
            <span class="pick-word">Отвечает</span>
            <label class="pick-option">
              <input type="radio" name="provider" value="anthropic" /><span>Claude</span>
            </label>
            <span class="pick-word" id="provider-or">или</span>
            <label class="pick-option">
              <input type="radio" name="provider" value="openai" /><span>OpenAI-совместимая</span>
            </label>
            <span class="pick-word" id="local-or" hidden>или</span>
            <label class="pick-option" id="local-option" hidden>
              <input type="radio" name="provider" value="local" /><span>модель на компьютере</span>
            </label>
          </fieldset>
          <p class="hint" id="provider-hint"></p>

          <div class="local" id="local" hidden>
            <ul class="rows" id="local-models"></ul>
            <ul class="rows" id="gpu-row">
              <li>
                <label class="row">
                  <input type="checkbox" class="tick" id="gpu" />
                  <span class="row-text">
                    <span class="row-title">Аппаратное ускорение</span>
                  </span>
                </label>
              </li>
            </ul>
          </div>

          <div class="form" id="form">
            <label class="field">
              <span class="field-label">Ключ API <span class="field-status" id="key-state"></span></span>
              <span class="input-wrap">
                <input class="input" id="api-key" type="password" autocomplete="off" spellcheck="false" />
                <button class="input-icon" id="key-eye" type="button" aria-label="Показать ключ" aria-pressed="false">
                  <svg class="icon"><use href="#i-eye" /></svg>
                </button>
              </span>
            </label>

            <div class="pair">
              <label class="field">
                <span class="field-label">Модель</span>
                <input class="input" id="model" spellcheck="false" />
              </label>
              <div class="field" id="effort-field">
                <span class="field-label" id="effort-label">Усилие</span>
                <span class="select-wrap">
                  <button class="input select" id="effort" type="button" aria-labelledby="effort-label"></button>
                  <svg class="icon"><use href="#i-chevron" /></svg>
                </span>
              </div>
            </div>

            <details class="more">
              <summary><svg class="icon"><use href="#i-chevron" /></svg>Свой адрес API</summary>
              <input class="input" id="base-url" spellcheck="false" aria-label="Адрес API" />
              <p class="hint" id="base-url-hint"></p>
            </details>
          </div>

          <div class="check">
            <button class="btn-mark" id="test" type="button">Проверить</button>
          </div>
          <figure class="sheet preview" id="test-result" aria-live="polite" hidden>
            <p class="preview-before"><mark id="test-before"></mark></p>
            <p class="preview-after" id="test-after"></p>
          </figure>
        </section>

        <section class="view" id="view-general" role="tabpanel" aria-labelledby="tab-general" hidden>
          <ul class="rows">
            <li>
              <label class="row">
                <input type="checkbox" class="tick" id="enabled" />
                <span class="row-text">
                  <span class="row-title">Сочетания клавиш работают</span>
                </span>
              </label>
            </li>
            <li>
              <label class="row">
                <input type="checkbox" class="tick" id="show-hud" />
                <span class="row-text">
                  <span class="row-title">Ярлычок под полем ввода</span>
                </span>
              </label>
            </li>
            <li>
              <label class="row">
                <input type="checkbox" class="tick" id="autostart" />
                <span class="row-text">
                  <span class="row-title">Запускать вместе с системой</span>
                </span>
              </label>
            </li>
          </ul>

          <div class="ax" id="ax-group" hidden>
            <h2 class="title">Универсальный доступ</h2>
            <p class="ax-text"><span id="ax-state"></span> <button class="link" id="ax-open-2" type="button">Открыть настройки macOS</button></p>
          </div>

          <p class="about">
            Airtype <span id="version"></span>. <span id="update-result"></span>
            <button class="link" id="update-check" type="button">Проверить обновления</button>
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
