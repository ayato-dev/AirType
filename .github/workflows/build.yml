name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release of the version in tauri.conf.json (creates its v tag)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The Windows and macOS code (UI Automation, AX, clipboard) only compiles on
    # its own system, so lint and test on all three.
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (macOS 26) often waits a long time for a runner; macos-15
        # has its own pool and builds the same universal app.
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo fmt --check
        if: runner.os == 'Linux'
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-15
            name: macos
            args: --target universal-apple-darwin
          # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
          - os: ubuntu-22.04
            name: linux
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libssl-dev patchelf
      - run: npm ci
      # Signs the update bundles (.sig next to each); the app checks them
      # against the public key in tauri.conf.json.
      - run: npx tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: airtype-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/release/bundle/deb/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The installers are named after the app version, so the tag must match it.
      # A manual run makes the tag itself and refuses to reuse an existing one.
      - name: Pick the tag
        id: tag
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME, but tauri.conf.json says $tag"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is already released; bump the version first"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # What the updater reads: the version and a signed download per platform.
      # macOS gets one universal bundle for both chips.
      - name: Write latest.json
        run: |
          tag="${{ steps.tag.outputs.name }}"
          version="${tag#v}"
          mkdir -p updates
          one() { find artifacts -name "$1" | head -n 1; }
          win=$(one '*_x64-setup.exe')
          mac=$(one '*.app.tar.gz')
          linux=$(one '*.AppImage')
          for f in "$win" "$mac" "$linux"; do
            [ -n "$f" ] && [ -f "$f.sig" ] || { echo "::error::no signed update bundle: '$f'"; exit 1; }
          done
          cp "$mac" "updates/Airtype_${version}_universal.app.tar.gz"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "$base/$(basename "$win")" --rawfile win_sig "$win.sig" \
            --arg mac_url "$base/Airtype_${version}_universal.app.tar.gz" --rawfile mac_sig "$mac.sig" \
            --arg linux_url "$base/$(basename "$linux")" --rawfile linux_sig "$linux.sig" \
            '{version: $version, pub_date: $date, platforms: {
              "windows-x86_64": {url: $win_url, signature: $win_sig},
              "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
              "darwin-x86_64": {url: $mac_url, signature: $mac_sig},
              "linux-x86_64": {url: $linux_url, signature: $linux_sig}}}' > updates/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Airtype ${{ steps.tag.outputs.name }}
          body_path: .github/release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            updates/*
