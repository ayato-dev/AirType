<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Airtype HUD</title>
    <link rel="stylesheet" href="/src/styles/hud.css" />
  </head>
  <body>
    <div class="pill" id="pill" data-state="working" role="status" aria-live="polite">
      <span class="pill-icon" aria-hidden="true">
        <span class="spinner"></span>
        <svg class="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>
        <svg class="warn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" /><path d="M12 7.5v5M12 16.2v.1" /></svg>
      </span>
      <span class="pill-text" id="text"></span>
    </div>
    <script type="module" src="/src/hud.ts"></script>
  </body>
</html>
