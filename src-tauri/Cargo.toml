[package]
name = "airtype"
version = "0.2.1"
description = "Lightweight AI translator and editor for any text field"
edition = "2021"
rust-version = "1.80"

[lib]
name = "airtype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "system-proxy"] }
arboard = { version = "3", default-features = false }
# Linux keeps keys in the Secret Service (GNOME Keyring, KWallet) over D-Bus.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
url = "2"
# Checks the local model and its server against known hashes after download.
sha2 = "0.10"
# Unpacks the local model's server (gzip, and deflate inside zip); pure Rust.
flate2 = "1"
# Lets a panel request be dropped mid-flight; Tauri already runs on tokio.
tokio = { version = "1", default-features = false, features = ["macros", "time"] }

[target.'cfg(windows)'.dependencies]
# Already pulled in by Tauri's WebView2 layer; here only for UI Automation (COM).
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# llama.cpp ships its Windows builds as zip.
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The local model's server goes down with the app (PR_SET_PDEATHSIG).
libc = "0.2"
# Already in the tree through arboard; XTest sends Ctrl+C/V on X11.
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
# Already pulled in by Tauri; here for the pasteboard and the frontmost app.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSRunningApplication",
  "NSWorkspace",
] }

[target.'cfg(not(windows))'.dependencies]
# llama.cpp ships its macOS and Linux builds as tar.gz.
tar = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
